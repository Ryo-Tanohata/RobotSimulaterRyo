<title>人類史テックツリー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 配置：上に3層のツリー一覧（年代順の列）、下に設計ノート。参照IDのチップでノートの該当見出しへ飛ぶ */
:root{
  --bg:#f3f4f1; --surface:#fbfbf9; --fg:#1f2724; --muted:#5d6762; --line:#d6dad4;
  --accent:#2d5b6b; --accent-soft:#dfe9ec;
  --body:#7a5a2f; --body-soft:#f0e7d9;
  --cap:#2f5f8a; --cap-soft:#dfe8f2;
  --work:#4f6b3a; --work-soft:#e3ecda;
  --hl:#fff1b8;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a19; --surface:#1c2221; --fg:#e4e8e5; --muted:#9aa49f; --line:#2f3836;
  --accent:#8cc0cf; --accent-soft:#22343a;
  --body:#d9b47e; --body-soft:#33291c; --cap:#8db8e0; --cap-soft:#1f2c3a; --work:#a9c78e; --work-soft:#25301d;
  --hl:#4a4320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a19; --surface:#1c2221; --fg:#e4e8e5; --muted:#9aa49f; --line:#2f3836;
  --accent:#8cc0cf; --accent-soft:#22343a;
  --body:#d9b47e; --body-soft:#33291c; --cap:#8db8e0; --cap-soft:#1f2c3a; --work:#a9c78e; --work-soft:#25301d;
  --hl:#4a4320; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:1120px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:grid;gap:6px;margin-bottom:28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:24px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;font-weight:500}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-bottom:16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.nodes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.node{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px;min-width:0}
.node-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.node h3{font-family:var(--f-display);font-size:20px;margin:0}
.era{font-size:12px;color:var(--muted);margin-left:auto}
.req{font-size:12px;color:var(--muted)}
.layer{display:grid;grid-template-columns:3.2em 1fr;gap:8px;align-items:start;font-size:14px}
.layer .tag{font-size:12px;font-weight:700;text-align:center;border-radius:3px;padding:1px 0}
.layer.body .tag{background:var(--body-soft);color:var(--body)}
.layer.capability .tag{background:var(--cap-soft);color:var(--cap)}
.layer.work .tag{background:var(--work-soft);color:var(--work)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.ground{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gbox{display:grid;gap:4px;background:var(--bg);border-radius:4px;padding:8px 10px}
.gtop{display:flex;align-items:center;gap:8px;font-size:13px}
.gtop .ground{font-size:16px}
.gbar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent)}
.gsub{font-size:12.5px;color:var(--muted);line-height:1.6}
.tiers{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:6px;min-width:0}
.tier h3{font-family:var(--f-display);font-size:18px;margin:0}
.tier p{margin:0;font-size:14px}
.tiers > p{grid-column:1/-1;margin:0}
.effects{font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none;display:grid;gap:2px}
a.ref{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 5px;text-decoration:none;white-space:nowrap}
a.ref:hover{text-decoration:underline}
a.ref:focus-visible{outline:2px solid var(--accent)}
.refs{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
section{scroll-margin-top:56px}
h2.sec{font-family:var(--f-display);font-size:24px;margin:48px 0 16px}
.stages{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:12.5px}
td.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{max-width:72ch}
.note h1{display:none}
.note h2{font-family:var(--f-display);font-size:22px;margin:40px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.note h3{font-size:16px;margin:24px 0 6px;scroll-margin-top:60px;border-radius:4px;transition:background .6s}
.note h3.flash{background:var(--hl)}
.note p,.note li{color:var(--fg)}
.note hr{display:none}
.note code{font-family:var(--f-mono);font-size:.9em;background:var(--accent-soft);padding:0 4px;border-radius:3px}
.note table{margin:12px 0}
.note .tablebox{overflow-x:auto}
.note a{color:var(--accent)}
.note strong{color:var(--body)}
footer{margin-top:48px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.note h3{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="ver"></div>
    <h1>人類史シミュレーター テックツリー</h1>
    <p class="lede">各ノードを「身体 → 能力 → 仕事」の3層で記述した叩き台です。青い参照IDを押すと、設計ノートの根拠に移ります。</p>
  </header>

  <nav class="tabs" aria-label="セクション">
    <a href="#tree">ノード</a>
    <a href="#stages">ライフステージ</a>
    <a href="#judge">判定の流れ</a>
    <a href="#note">設計ノート</a>
  </nav>

  <section id="tree">
    <div class="legend">
      <span><i class="sw" style="background:var(--body)"></i>身体＝物質的な土台</span>
      <span><i class="sw" style="background:var(--cap)"></i>能力＝外部化された知性</span>
      <span><i class="sw" style="background:var(--work)"></i>仕事＝生まれた働き方</span>
      <span>接地度＝意味・結果・身体の平均（0〜1。棒が長いほど身体や現場に根ざしている。良い・悪いではない）</span>
    </div>
    <div class="nodes" id="nodes"></div>
  </section>

  <section id="stages">
    <h2 class="sec">ライフステージと不変項</h2>
    <div class="stages"><table id="stageTable"></table></div>
  </section>

  <section id="judge">
    <h2 class="sec">判定の流れ</h2>
    <div class="tiers" id="tiers"></div>
  </section>

  <section id="note">
    <h2 class="sec">設計ノート</h2>
    <article class="note" id="noteBody"></article>
  </section>

  <footer>元データ：tech_tree.json と design_note.md。どちらも同じフォルダに置いて管理します。</footer>
</div>

## 1. 設計の思想

### 出発点：人間性を「変わらないもの」として取り出す

一般人の一生を、時代を変えて何度も走らせます。時代ごとに変わるものと、どの時代にも残るものを分けます。残るほうを人間性の候補とします。テックツリーは「時代」を、ライフステージは「一生」を表します。[R00]

### 三本柱：身体・技術・倫理

理論の三本柱は、『知の生態学的転回』の身体・技術・倫理を採ります。環境との関わりから知性を捉える生態学的アプローチ（ギブソン）が背景にあります。テックツリーでは「身体」を層として、「技術」をノード全体として、「倫理」を不変項の判定として扱います。[R01] [R02] [D05]

### 空中メリーゴーランド：接地を失った回転

近代社会は、身体や現場に接地しないまま回り続けているという見立てです。言葉が身体経験に接地していないと意味が成り立たないという「記号接地問題」と重ねて、ノードごとに接地度を持たせます。バベルの塔は接地を失った崩壊の例です。[R00] [R03] [R04] [D03]

### ベンチマークの型を借りる

AI ベンチマークは、タスク・環境・成功基準・採点者でできています。この型を、ライフステージ（タスク）、ノード（環境）、不変項（成功基準）、Claude（採点者）に置き換えます。ベンチの中身を能力・仕事・身体に分けた整理を、各ノードの3層に使います。[R14] [D01]

## 2. 設計判断

### D01 ノードを「身体・能力・仕事」の3層で記述する

AI ベンチマークを中身で分けると、知性の核を測る「能力」、人間の業務を測る「仕事」、基盤を測る「身体」の3つになります。この分類をそのまま全時代に広げ、各技術が何を土台にし、何を可能にし、どんな働き方を生んだかを記述します。[R14] [R15] [R16] [R17]

### D02 開放順は「身体 → 能力 → 仕事」

土台がなければ能力は生まれず、能力がなければ仕事は生まれない、という依存関係を表します。環境が行為の可能性を与えるというアフォーダンスの考え方に沿っています。ゲームとしては、3層すべてを開放するとノード習得です。[R02] [R01]

### D03 接地度（grounding）

「空中メリーゴーランド」を数値で見えるようにする値です。v0.5 から 0〜1 の値にし、大きいほど身体や現場に根ざしている状態を表します。これは記述であって、良い・悪いの判定ではありません（判定は陪審団、D08）。意味・結果・身体の3軸の平均で出します（D06、D10）。宇宙居住（N10）は、離れきるか、もう一度接地するかが問いそのものです。そのため値を1つに決めず、シナリオを並べています。[R00] [R03] [R12]

### D06 接地度の合成ルール

採点するのは、そのノードで新しく生まれた仕事の担い手です。3軸はそれぞれ0〜1で、接地度はその平均です（重みは等しい）。v0.4 までの「距離・身体・意味」を、D10 で検証済みの尺度に置き換えました。[R27] [R28] [R29]

- 意味：職務特性モデルの技能多様性・タスク完結性・タスク重要性（1〜7）の平均 x から (x−1)/6
- 結果：職務特性モデルの「仕事からのフィードバック」（1〜7）から (x−1)/6。以前の「距離（成果までの段階数）」の置き換え
- 身体：O*NET の「一般的な身体活動」の重要度 / 100。近い職業がないとき（狩猟採集・宇宙居住）は推定
- 自律性（手綱の余地）と波及は、接地度に足さず別に出す（D07）

### D04 指標：AI の時代だけ実在のベンチで埋める

計算機・AI（N09）だけは、実在のベンチで3層すべてに数値を入れられます。能力は GPQA など、仕事は AutomationBench など、身体は GPU ベンチです。N01〜N08 は識字率や人口密度などの歴史的な代理指標で代えます。[R15] [R16] [R17]

### D05 倫理は層にせず、ライフステージ側で判定する

既存のベンチは倫理をほとんど測っていません。そこで倫理を4つ目の層にはせず、各ライフステージで「人間性の不変項が保たれたか」を判定する形で扱います。エージェントの有無で一生を比べ、不変項が保たれるか削られるかを見ます。[R00] [R01]

### D07 手綱：道具との付き合い方を接地度に入れる

同じ仕事でも、道具と付き合う姿勢で接地は変わります（Lou の指摘）。理由を言えて、理念から選んでいるとき、手綱を握っているとみなします。v0.5 では、手綱を握った使い方を、職務特性モデルの評定そのものに反映します。目的を自分で決めて全体を組み立てれば、技能多様性・完結性・フィードバックが上がるからです。エージェントは手の延長になります（拡張された心）。身体の軸は変わりません。体を使わない時間の長さは別の問題として残るからです（I1）。

手綱を握れる余地は、職務特性モデルの「自律性」で別に出します。周りの接地への影響（波及、−1〜+1）も別に出し、接地度には足しません。v0.4 までは波及を足していましたが、記述（接地度）と価値（周りに良いか悪いか）が混ざるため分けました。[R00] [R05] [R28]

### D08 判定は仮想の陪審団が行い、判定表には時代ごとの版を付ける

人による検査は行いません。Claude で「一般的な人間」を陪審員として作り、判定させます。陪審員の属性や価値観は、人が積み上げた調査データの分布から生成します。結果は一つの正解ではなく、賛否の分布で出します。全員が一致した判定は安定した評価、割れた判定は時代や価値観で変わる部分として記録します。判定表は「2026年版」のように版を付けて固定し、時代ごとの版で同じ一生を採点し直します。版が変わっても評価が変わらない部分を、人間性の不変項の候補とします。[R21] [R22] [R23] [R24] [R25] [R26]

判定する者を判定するという入れ子は残ります。しかし、陪審団の判定そのものを「機械が持つ人間像」として観察の対象にします。これはヒューマノイドの人間らしさを測る後半のテーマにつながります。言語モデルが演じる集団は多様さが平板になりやすい点に注意し、同じ事例を言い換えても判定が変わらないかを機械的に確かめます。[R22]

### D09 判定は3段階に分け、陪審団は大事な場面だけで使う

トークンの消費を抑えるため、判定を3段階に分けます。段階0（毎ターン）は記録だけで、接地度の「高さ」はスクリプトで計算します。段階1（ライフステージの区切りごと）は、安いモデル1回で「理由」「理念」「波及」の有無を抜き出します。段階2（陪審団）は、抜き出しが「不明」、波及がある、ノード切り替え直後、品質確認の抜き取り、のどれかの場面だけで使います。まず3人で判定し、割れたときだけ12人に増やします。判定表の版が変わったときは、段階2の場面だけを採点し直します。

### D10 接地度を検証済みの尺度で根拠づける

v0.4 までの接地度は、軸の考え方には文献があったものの、段階の数え方・幅・重み・「0が最良」という読み方は仮定でした。そこで v0.5 で、軸を検証済みの尺度に乗り換えました。職務特性モデル（R28）の3つの心理状態のうち、「意味を感じる」を意味の軸に、「結果が分かる」を結果の軸に、「責任を感じる（自律性）」を手綱の余地に当てます。身体の軸は、作業設計質問紙（R29）の「身体的な負荷」の考え方に沿い、O*NET（R27）の職業の実データで埋めます。

根拠の強さは軸で違います。身体は実データですが、近い現代の職業で代えています。意味と結果は、尺度の定義に沿って Claude が付けた評定です。答え合わせとして、ブラウナー（R30）の産業の比較と順位が合うか、自律性の評定が O*NET の「決める自由」と合うかを確かめました（「答え合わせ」の節）。その後、陪審団（D08）に同じ項目を独立に評定させました。作り手との相関は高かった（接地度で 0.91）ものの、作り手は全体に高めで狩猟採集を理想化していたため、v0.6 から陪審団の平均を正式な評定にしました。v0.7 では陪審団を 12 人に広げ、昔の時代の人物と、価値観の違う現代の人物を加え、3 つのモデルを混ぜました。人物よりモデルの違いが大きいこと、自分と同じ種類の仕事を高く見ることが分かりました（「答え合わせ」の節）。[R27] [R28] [R29] [R30] [R31]

## 3. 人間性の不変項（仮説）

どれも検証前の仮説です。どこかのノードで消えれば不変項から外します。

### I1 身体を持ち、いつか死ぬ

誕生・老い・看取りに現れます。宇宙居住でも残るかが試金石です。[R01]

### I2 他者に養われて育つ

育ての担い手が家族から施設、エージェントへと変わっても、「養われる」構造が残るかを見ます。調理と分配の起源までさかのぼります。[R07]

### I3 言葉で意味を分け合う

もっとも脆い不変項です。接地を失うと壊れる（バベル）ため、接地度と直接つながります。[R03] [R04]

### I4 先を思い、悼む

計画と喪失、つまり時間の中を生きることです。現時点では本人の構想が根拠で、学術的な裏付けは今後の課題です。[R00]

**読み取れること**

- 接地度は時代順に一方的には下がりません。集団の狩り（0.80）・職人（0.78）・農民（0.75）・狩猟採集（0.72）・印刷工（0.72）が高く、書記（0.27）・事務職（0.16）が低くなります。手で物を扱い、仕上がりが見える仕事は、新しい時代にも接地を保てます。
- 産業の時代で一番低いのは事務職（0.16）です。産業革命以降の事務職と労働疎外という問題意識と合っています。[R00] [R13]
- AI の時代は、使い方で大きく分かれます。無自覚に使えば 0.14 で、事務職より低くなります。理念を持って使えば 0.53、理解を残す仕組みを作れば 0.58 です。体を使わないので、職人や農民には届きません。
- 宇宙居住は 0.06（無自覚に任せる）から 0.82（生命維持を自分たちで営む）まで広がります。どちらになるかはエージェントとの付き合い方しだいです。

### 答え合わせ

**陪審団の評定と作り手の評定**（R31）：陪審団 12 人（D08 の仮想の陪審員）に、33 の仕事を、作り手の評定を見せずに評定させました（`jury/`）。

| 陪審員 | モデル |
|---|---|
| 現代日本の看護師・現代ナイジェリアの農家・1960 年代デトロイトの組立工・現代ドイツのソフトウェア技術者・18 世紀ロンドンの印刷工房の親方・現代インドの事務員 | haiku |
| 約 1 万 4 千年前のレバントの採集民の女性・前 2100 年ごろのウルの神殿の書記・江戸後期の大坂の大工の棟梁・現代ヨルダンの商店主（伝統と生活の安定を重んじる文化圏） | sonnet |
| 前 7000 年ごろのアナトリアの農耕村の男性・現代スウェーデンの保育士（世俗的で自己表現を重んじる社会） | opus |

文化圏の選び方は、世界価値観調査の文化地図（R26）の両端からです。

| 項目 | 陪審員どうしの一致（級内相関、1 人／平均） | 作り手との相関 | 平均の差（作り手 − 陪審団） |
|---|---|---|---|
| 技能多様性 | 0.88 ／ 0.99 | 0.89 | +0.43 |
| タスク完結性 | 0.82 ／ 0.98 | 0.87 | +0.53 |
| タスク重要性 | 0.77 ／ 0.98 | 0.83 | +0.15 |
| 自律性 | 0.89 ／ 0.99 | 0.89 | +0.72 |
| フィードバック | 0.82 ／ 0.98 | 0.91 | +0.15 |
| 接地度（合成） | ― | 0.95（順位 0.92） | ― |

- **作り手のくせ**：並びはよく一致しましたが、作り手の評定は全体に高めでした。作り手の偏りを減らすため、陪審団の平均を正式な評定にしています。
- **人物よりモデルの違いが大きい**：同じ人物（デトロイトの組立工、ドイツの技術者）をモデルだけ変えて演じさせると、評定は平均 0.64〜0.87 点ずれました。同じモデルで人物を変えたときのずれ（0.46 点）より大きい差です。モデルごとに甘さも違います（平均評定 haiku 4.27、sonnet 4.61、opus 4.67）。そのため、陪審団には複数のモデルを混ぜます。混ぜたことで、陪審員どうしのばらつきは平均 0.41 点から 0.56 点に広がりました。
- **自分の仕事を高く見る**：人物の違いが一番はっきり出たのは、自分と同じ種類の仕事です。同じ sonnet の中でも、採集民の女性は採集を（接地度 0.82、ほかの人物は 0.71〜0.73）、ウルの書記は書記を（0.42、ほかは 0.26〜0.28）高く評定しました。
- **時代による違い**：狩猟採集（N01）の接地度は、昔の陪審員で 0.81、近世で 0.67、近現代で 0.70 でした。6 人（近現代と近世だけ）のときの 0.63 は、現代の見方に寄っていたと考えられます。ただし昔の陪審員はみな sonnet か opus で、甘めのモデルの影響も混ざっています。

**ブラウナーの逆U字**（R30）：疎外は、印刷（職人型）で低く、繊維（機械番）・自動車（組立ライン）で高く、化学（自動化）で再び下がります。陪審団 12 人の評定でも、接地度は 印刷 0.72 ＞ 化学 0.62 ＞ 繊維 0.52 ＞ 組立 0.34 で、同じ順番になりました。陪審団にはブラウナーの研究を示していません。身体の実データだけで並べると、化学 0.68 ＞ 印刷 0.63 ＞ 組立 0.62 ＞ 繊維 0.51 で、順番は合いません。逆U字を生んでいるのは意味と結果の軸です。

**自律性と O*NET の「決める自由」**（R27）：作り手の評定では、O*NET の値がある 9 件で順位の相関は 0.37 でした（弱い一致）。大きくずれたのは組立ラインと書記です。評定は昔の仕事を思い浮かべて付けますが、O*NET は現代の米国の職業です。近い現代の職業で代えるときは、時代の違いに注意が要ります。

### 状況で評価が変わる事象（判定表）

行為（使う・使わない）ではなく、判断の質で採点します。物差しは「理由を言えるか」「理念から選んでいるか」「周りの接地を増やすか」の3つです。[D07]

| ID | 事象 | ＋になる状況 | −になる状況 |
|---|---|---|---|
| C1 | AIを使うより自分でやった方が早い | 経験に基づく判断で、手の技能を保っている | 試さずに避けている |
| C2 | AIを学ぶ時間があるなら仕事をする | 手仕事が本分で、AIを入れると距離が増えるだけだと分かっている | 変化への恐れや惰性で学ばない |
| C3 | 学習コスト0の仕組みを作る | 使う人の理解を残したまま距離を縮める | 中身を完全に隠し、使う人を空中に置く |

## 5. 参考文献

### R00 ヒューマノイド・エージェント論（Lou の構想）

「ヒューマノイド・エージェント論 ── 空中メリーゴーランドの手綱」と、講義シリーズ「機械を人間化する ── 宇宙で暮らす人類と、エージェントの12講」。未刊行の構想で、本設計の思想上の出発点です。

### R01 『知の生態学的転回』（東京大学出版会）

全3巻（身体・技術・倫理）。三本柱の出典です。**要確認**：各巻の正式な書名・編者・刊行年。

### R02 J・J・ギブソン『生態学的視覚論』

原著 *The Ecological Approach to Visual Perception*（1979）。アフォーダンスの概念。R01 の理論的な背景です。

### R03 今井むつみ・秋田喜美『言語の本質 ことばはどう生まれ、進化したか』

中公新書、2023年。記号接地問題を軸に、言語と身体の関わりを論じています。接地度の考え方の根拠です。

### R04 Stevan Harnad &quot;The Symbol Grounding Problem&quot;

*Physica D* 42, 1990。記号が身体経験に接地しないと意味を持たないという問題の原論文です。

### R05 Andy Clark &amp; David Chalmers &quot;The Extended Mind&quot;

*Analysis* 58, 1998。認知は道具や記録にまで広がるという「拡張された心」。記憶・思考の外部化の根拠です。

### R06 マーシャル・マクルーハン『メディア論 人間の拡張の諸相』

原著 *Understanding Media*（1964）。技術を人間の身体や感覚の拡張とみる視点。能力層の「外部化」の根拠です。

### R07 リチャード・ランガム『火の賜物 ヒトは料理で進化した』

原著 *Catching Fire*（2009）。加熱調理が人類の進化を駆動したという仮説です。

### R08 ジャレド・ダイアモンド『銃・病原菌・鉄』

原著 *Guns, Germs, and Steel*（1997）。農耕と家畜化が社会の分岐を生んだという議論です。

### R09 ジェームズ・C・スコット『反穀物の人類史』

原著 *Against the Grain*（2017）。穀物・定住・初期国家と、書記・徴税の結びつきを論じています。

### R10 W・J・オング『声の文化と文字の文化』

原著 *Orality and Literacy*（1982）。文字が思考と記憶のあり方を変えたという議論です。

### R11 エリザベス・アイゼンステイン『印刷革命』

原著 *The Printing Press as an Agent of Change*（1979）。印刷による知識の複製と標準化です。

### R12 カール・マルクス『経済学・哲学草稿』

1844年執筆。労働の疎外の概念。接地度の低下と事務職の問題につながります。

### R13 C・ライト・ミルズ『ホワイト・カラー』

原著 *White Collar*（1951）。事務職・管理職の増加と、その働き方の分析です。

### R14 ベンチマーク三分類（本プロジェクトでの整理）

2026-10-14 の議論で、AI ベンチを集計団体ではなく中身で「能力・仕事・身体」に分け直したもの。D01 の直接の根拠です。

### R15 Epoch AI Benchmarking Hub

https://epoch.ai/benchmarks — 難度の高いベンチを厳選して追跡（約65）。能力層（GPQA Diamond、FrontierMath など）の参照先です。

### R16 BenchLM Benchmarks Directory

https://www.benchlm.ai/benchmarks — 比較可能なスコアのあるベンチ（2026年9月時点で435）。仕事層（AutomationBench、GDPval、法務・金融系）の参照先です。

### R17 AIMultiple &quot;800+ Leading AI Benchmarks&quot;

https://www.aimultiple.com/ai-benchmarks/ — GPU・クラウドまで含む一覧（836）。身体層の参照先です。

### R18 オリヴァー・サックスの言葉（構想の出発点）

「人間は機械を人間化しなければならない。機械によって人間性を失われる前に」。**要確認**：原典（書名・頁）。JSON からは直接参照していません。

### R19 Dyble ほか &quot;Engagement in agricultural work is associated with reduced leisure time among Agta hunter-gatherers&quot;

*Nature Human Behaviour*, 2019（DOI: 10.1038/s41562-019-0614-6）。フィリピンのアグタの人々を2年間観察した研究です。農耕中心の集団は週約30時間働き、狩猟採集中心の集団は約20時間でした。N01〜N03 の身体の比率が高いことの裏付けで、農耕で労働時間そのものが増えることも示しています。

### R20 Church ほか &quot;Trends over 5 Decades in U.S. Occupation-Related Physical Activity and Their Associations with Obesity&quot;

*PLoS ONE* 6(5): e19657, 2011。米国の民間雇用で、中程度以上の身体活動を要する仕事は1960年代初めの約50%から、2000年代には約20%に減りました。N07（工場）から N08（管理職・サービス）にかけて身体の比率が下がることの裏付けです。

### R21 Argyle ほか &quot;Out of One, Many: Using Language Models to Simulate Human Samples&quot;

*Political Analysis* 31(3), 2023。属性を与えた仮想の回答者を言語モデルで作り、実際の世論調査の分布をかなり再現できることを示しました（シリコン・サンプリング）。D08 の陪審団の根拠です。

### R22 Wang ほか &quot;Large language models that replace human participants can harmfully misportray and flatten identity groups&quot;

arXiv:2402.01908。言語モデルが演じる集団は、外からの見え方に寄りやすく、集団の中の多様さが平板になる傾向を示しました。D08 の注意点の根拠です。

### R23 Arora ほか &quot;HealthBench: Evaluating Large Language Models Towards Improved Human Health&quot;

OpenAI、2025年（arXiv:2505.08775）。262人の医師が採点基準を48,562項目書き、AIが採点し、AIと医師の一致度が医師どうしと同程度であることを確かめました。人間が基準を書き、AIが当てはめる方式の例です。

### R24 Anthropic &quot;Collective Constitutional AI&quot;

2023年。約1,000人の市民が Polis 上で AI のルールを議論しました。多くは合意できましたが、2つの意見グループの間で割れた項目は除外しました。合意と対立を分けて記録する方式の例です。

### R25 Hendrycks ほか &quot;Aligning AI With Shared Human Values&quot;

ICLR 2021（arXiv:2008.02275）。道徳的な判断に人の付けた正解を固定した ETHICS データセット。時代の価値観が凍結されるという限界の例です。

### R26 世界価値観調査（World Values Survey）

https://www.worldvaluessurvey.org/ — 各国の価値観を継続的に調べている国際調査です。陪審員の価値観の分布を決める出典の候補です。**要確認**：どの波・どの国のデータを使うか。

### R27 O*NET OnLine（米国労働省の職業情報）

https://www.onetonline.org/ — 職業ごとの仕事の特徴の調査データ。身体の軸に「一般的な身体活動」の重要度（0〜100）を、自律性の答え合わせに「決める自由」の分布を使いました（2026-10-14 に確かめた値）。使った職業：45-2092.00 農作業員（作物）76、45-2093.00 農作業員（家畜）75、47-2061.00 建設作業員 68、51-8091.00 化学プラントの運転員 68、51-7011.00 家具職人 64、51-5112.00 印刷機の運転員 63、51-2092.00 組立工 62、51-6064.00 繊維機械の運転員 51、43-9061.00 一般事務員 29、11-1021.00 経営・管理職 28、15-1252.00 ソフトウェア開発者 17、43-3031.00 簿記・会計の事務員 16。現代の米国の職業なので、昔の仕事に当てるときは近いものとして扱います。

### R28 Hackman &amp; Oldham 職務特性モデルと職務診断調査（JDS）

Hackman &amp; Oldham &quot;Development of the Job Diagnostic Survey&quot; *Journal of Applied Psychology* 60(2), 1975、および技術報告書 &quot;The Job Diagnostic Survey&quot;（1974、DTIC AD0779828）。仕事の5つの特性（技能多様性・タスク完結性・タスク重要性・自律性・仕事からのフィードバック）を1〜7で測り、そこから「意味を感じる」「責任を感じる」「結果が分かる」の3つの心理状態が生まれるとするモデルです。報告書は、正式な基準値はまだないので比較に使うよう注意しています。

### R29 Morgeson &amp; Humphrey &quot;The Work Design Questionnaire (WDQ)&quot;

*Journal of Applied Psychology* 91, 1321–1339, 2006。仕事を課題・知識・社会・作業環境の21の特性で測る質問紙です。身体的な負荷は「筋持久力が要る」「筋力が要る」「体を大いに使う」の3項目（1〜5）。身体の軸の定義の根拠です。

### R30 ロバート・ブラウナー『疎外と自由』（Alienation and Freedom）

1964年。職人型（印刷）・機械番（繊維）・組立ライン（自動車）・自動化（化学）の4つの技術の型で、工場労働者の疎外を比べました。疎外は組立ラインで最も高く、自動化で再び下がる（逆U字）。技術決定論だという批判もあります。答え合わせに使いました。

### R31 Shrout &amp; Fleiss &quot;Intraclass correlations: Uses in assessing rater reliability&quot;

*Psychological Bulletin* 86(2), 420–428, 1979。評定者どうしの一致を測る級内相関（ICC）の型を整理した論文です。陪審団の評定の一致に ICC(2,1)・ICC(2,k)（二元配置・変量・絶対一致）を使いました。

- 陪審員は今も Claude だけ。人物より Claude のモデルの違いのほうが効くので、ほかの会社の言語モデルを混ぜると、さらに独立した評定になる（D08・D10）
- 自分と同じ種類の仕事を高く見る傾向を、評定の集め方でどう扱うか（その仕事の担い手の評定を外す、重みを下げる、など）

      ${eff ? `<ul class="effects">${eff}</ul>` : ''}
      ${gdetail}
      <div class="meta-row"><span>接地度は${esc(G.status)}${refs(G.refs)}</span><span>${ind}</span></div>
    </article>`;
  }).join('');

  document.getElementById('stageTable').innerHTML =
    '<thead><tr><th>ID</th><th>段階</th><th>関わる不変項（仮説）</th></tr></thead><tbody>' +
    tree.life_stages.map(s => `<tr><td class="mono">${s.id}</td><td>${esc(s.name)}</td><td>${s.invariants.map(i => `<a class="ref" href="#${i}">${i}</a> ${esc(invName[i])}`).join('<br>')}</td></tr>`).join('') +
    '</tbody>';

  const jp = tree.judgment_pipeline;
  if (jp) {
    document.getElementById('tiers').innerHTML = jp.tiers.map(t => `
      <article class="tier">
        <div class="node-head"><span class="nid">段階${t.tier}</span><h3>${esc(t.name)}</h3><span class="era">${t.uses_llm ? 'Claudeを使う' : 'Claudeを使わない'}</span></div>
        <div class="req">${esc(t.when)}</div>
        <p>${esc(t.does || t.escalation)}</p>
        ${t.triggers ? `<ul class="effects">${t.triggers.map(x => `<li>・${esc(x)}</li>`).join('')}</ul><p class="gsub">${esc(t.escalation)}</p>` : ''}
      </article>`).join('') +
      `<p class="gsub">${esc(jp.rescoring)}。一生あたりの目安：段階1 ${esc(jp.token_estimate_per_life.tier1)}、段階2 ${esc(jp.token_estimate_per_life.tier2)}（${esc(jp.token_estimate_per_life.status)}）${refs(jp.refs)}${refs(tree.jury_spec ? tree.jury_spec.refs.slice(0,1) : [])}</p>`;
  }

  const body = document.getElementById('noteBody');
  if (window.marked) {
    body.innerHTML = marked.parse(noteMd);
  } else {
    body.innerHTML = '<pre style="white-space:pre-wrap">' + esc(noteMd) + '</pre>';
  }
  body.querySelectorAll('h3').forEach(h => {
    const m = h.textContent.trim().match(/^([RDI]\d{1,2})\b/);
    if (m) h.id = m[1];
  });
  body.querySelectorAll('table').forEach(t => { const d = document.createElement('div'); d.className = 'tablebox'; t.replaceWith(d); d.appendChild(t); });
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) { if (/\[[RDI]\d{1,2}\]/.test(walker.currentNode.nodeValue)) targets.push(walker.currentNode); }
  targets.forEach(t => {
    const span = document.createElement('span');
    span.innerHTML = esc(t.nodeValue).replace(/\[([RDI]\d{1,2})\]/g, '<a class="ref" href="#$1">$1</a>');
    t.replaceWith(span);
  });

  function flash(){
    const id = location.hash.slice(1);
    const el = id && document.getElementById(id);
    if (el && el.tagName === 'H3') { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
  }
  window.addEventListener('hashchange', flash);
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) { el.scrollIntoView(); flash(); } }
})();
</script>
