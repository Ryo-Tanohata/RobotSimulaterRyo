<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>村の跡と記録</title>
<link rel="icon" href="data:,">
<meta name="description" content="川辺の村を今掘ったら何が残っているか。季節ごとの跡と、村の記録。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 村の跡と記録 (docs/dashboard_design.md)。色は名前つきの値だけ。データは青 1 色、目立たせないものは灰色、層は土の色の濃淡 */
:root {
  color-scheme: light;
  --bg: #edf1ec; --surface: #fbfcfa; --fg: #1d2520; --muted: #5a675e; --line: #cdd7ce; --grid: #e2e8e1;
  --accent: #b36a1e; --link: #8f5210; --data: #2a78d6; --data-wash: rgba(42, 120, 214, .12); --ctx: #8a948c;
  --ctx-fill: #d5dcd5; --band: #eef2ed; --future: rgba(237, 241, 236, .72); --sel: #1d2520;
  --l0: #de9f66; --l1: #cb8747; --l2: #b7722d; --l3: #a0601b; --l4: #884f0f; --l5: #6f400c; --l6: #573109;
  --lt0: #0b0f0c; --lt1: #0b0f0c; --lt2: #0b0f0c; --lt3: #ffffff; --lt4: #ffffff; --lt5: #ffffff; --lt6: #ffffff;
  --display: "Dela Gothic One", "Zen Kaku Gothic New", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #111612; --surface: #19201b; --fg: #e2e9e3; --muted: #9aa89e; --line: #2d3a31; --grid: #253028;
  --accent: #e39a4c; --link: #e8a65e; --data: #3987e5; --data-wash: rgba(57, 135, 229, .16); --ctx: #7d8a80;
  --ctx-fill: #36423a; --band: #1e2620; --future: rgba(17, 22, 18, .66); --sel: #e2e9e3;
  --l0: #86572c; --l1: #a06732; --l2: #b8793c; --l3: #d08c4c; --l4: #e3a165; --l5: #f3b885; --l6: #fdd1ac;
  --lt0: #ffffff; --lt1: #ffffff; --lt2: #111612; --lt3: #111612; --lt4: #111612; --lt5: #111612; --lt6: #111612;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111612; --surface: #19201b; --fg: #e2e9e3; --muted: #9aa89e; --line: #2d3a31; --grid: #253028;
  --accent: #e39a4c; --link: #e8a65e; --data: #3987e5; --data-wash: rgba(57, 135, 229, .16); --ctx: #7d8a80;
  --ctx-fill: #36423a; --band: #1e2620; --future: rgba(17, 22, 18, .66); --sel: #e2e9e3;
  --l0: #86572c; --l1: #a06732; --l2: #b8793c; --l3: #d08c4c; --l4: #e3a165; --l5: #f3b885; --l6: #fdd1ac;
  --lt0: #ffffff; --lt1: #ffffff; --lt2: #111612; --lt3: #111612; --lt4: #111612; --lt5: #111612; --lt6: #111612;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.65; overflow-x: hidden; }
a { color: var(--link); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .02em; margin: 0; line-height: 1.3; }
h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.4; }
h3 { font-size: 15px; margin: 0 0 6px; line-height: 1.4; }
p { margin: 0 0 8px; }
small, .muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }

/* 上の部分 */
.top { padding-top: 14px; padding-bottom: 8px; }
.title-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.asof { margin: 4px 0 2px; font-weight: 500; }
.yearnote { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.links { display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 14px; }
.links a, a.go { display: inline-flex; align-items: center; min-height: 36px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); font-weight: 700; }
.icon-btn { min-width: 44px; min-height: 44px; padding: 0 10px; }

/* この世界の時計 (上に止まる) */
.sticky { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0, 0, 0, .04); }
.clock { padding-top: 8px; padding-bottom: 4px; }
.clock-main { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.clock-row { display: flex; align-items: center; gap: 6px; }
.clock-row .btn { min-height: 44px; min-width: 44px; padding: 0 10px; }
.slabel { font-size: 17px; font-weight: 700; min-width: 6em; text-align: center; white-space: nowrap; }
.clock-sub { flex: 1 1 300px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; line-height: 1.45; }
.clock-sub .cname { color: var(--fg); font-weight: 700; }
.lchip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--fg); }
.lsw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.clock-more { padding: 6px 0 4px; }
.clock-more input[type=range] { width: 100%; accent-color: var(--data); height: 32px; margin: 0; }
.lband { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 2px 0 6px; }
.lband button { border: 0; padding: 0; font-size: 12px; font-weight: 700; min-width: 0; overflow: hidden; white-space: nowrap; }
.lband button.sel { box-shadow: inset 0 0 0 2px var(--sel); }
.ljump { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.ljump button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; min-width: 52px; justify-content: center; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 2px 10px; }
.ljump button.sel { box-shadow: inset 0 0 0 2px var(--sel); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 1 0; min-width: 58px; min-height: 48px; border: 0; border-bottom: 3px solid transparent; background: none; padding: 4px 4px 2px; color: var(--muted); line-height: 1.2; }
.tabs button b { display: block; font-size: 16px; }
.tabs button small { font-size: 11px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button[aria-selected="true"] small { color: var(--fg); }

/* 中身 */
main { padding-top: 14px; padding-bottom: 48px; }
section.panel { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
section.panel > *, .cols > div > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.lead { font-size: 14px; }
/* 2 列 (PC) / 1 列 (スマホ)。どちらでもカードのあいだは 14px あける */
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.cols > div { display: grid; gap: 14px; min-width: 0; align-content: start; }
.legend-line { font-size: 12px; color: var(--muted); margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile .label { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .value { font-size: 23px; font-weight: 700; line-height: 1.2; font-feature-settings: "palt" 0; }
.tile .value small { font-size: 14px; color: var(--fg); font-weight: 500; }
.tile .sub, .tile .delta, .tile .reading { font-size: 13px; line-height: 1.5; }
.tile .delta { color: var(--fg); }
.tile .reading { color: var(--muted); }
.tile svg.spark { width: 100%; height: 26px; display: block; }
.tile .go { font-size: 13px; margin-top: auto; }
.cert { font-size: 12px; white-space: nowrap; color: var(--fg); }
.cert .dots { letter-spacing: -.5px; margin-right: 3px; font-family: var(--body); }
details.how { font-size: 13px; }
details.how summary { cursor: pointer; color: var(--link); min-height: 28px; display: flex; align-items: center; }
details.how dl { margin: 6px 0 0; display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 2px 8px; }
details.how dt { color: var(--muted); }
details.how dd { margin: 0; }
details.how small { font-size: 12px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.dots { margin: 0; padding-left: 1.2em; }
ul.dots li { margin: 2px 0; }
.traces li { padding: 8px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.traces li:first-child { border-top: 0; }
.traces .t-name { font-weight: 700; }
.traces .t-val { grid-column: 1 / -1; }
.traces .t-read { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.traces .t-how { grid-column: 1 / -1; }
.badge { font-size: 12px; color: var(--muted); font-weight: 400; }
.fig-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.fig-head h3 { margin: 0; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 13px; min-height: 36px; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart text.ink { fill: var(--fg); }
.chart text.num { font-family: var(--mono); font-size: 11px; }
.caption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); align-items: center; margin: 2px 0 4px; }
.keys svg { vertical-align: middle; margin-right: 4px; }
.g-band { fill: var(--band); }
.g-grid { stroke: var(--grid); stroke-width: 1; }
.g-axis { stroke: var(--line); stroke-width: 1; }
.g-line { fill: none; stroke: var(--data); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.g-wash { fill: var(--data-wash); stroke: none; }
.g-dot { fill: var(--data); stroke: var(--surface); stroke-width: 2; }
.g-ring { fill: var(--surface); stroke: var(--data); stroke-width: 2; }
.g-pres { fill: var(--data); }
.g-ctx { fill: var(--ctx); }
.g-sel { stroke: var(--sel); stroke-width: 1.5; }
.g-hover { stroke: var(--muted); stroke-width: 1; }
.g-future { fill: var(--future); }
.hit { fill: transparent; cursor: pointer; }
.tablewrap { overflow-x: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
table.t { border-collapse: collapse; font-size: 13px; width: 100%; background: var(--surface); }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.t th { background: var(--bg); font-weight: 700; white-space: nowrap; position: sticky; top: 0; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t.nowrap td { white-space: nowrap; }
table.t .first { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.t th.first { background: var(--bg); z-index: 2; }
table.t tr.cur td, table.t tr.cur th { background: color-mix(in srgb, var(--data) 12%, var(--surface)); }
@media (max-width: 699px) {
  table.cards thead { display: none; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
  table.cards tr { border-bottom: 1px solid var(--line); padding: 8px 10px; }
  table.cards th.first { display: block; position: static; background: none; border: 0; padding: 0 0 2px; font-size: 14px; }
  table.cards td { border: 0; padding: 1px 0; display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 8px; line-height: 1.45; }
  table.cards td::before { content: attr(data-label); color: var(--muted); font-size: 12px; padding-top: 1px; }
  table.cards td.blank { display: none; }
  table.cards td.n { text-align: left; }
}
.more { margin-top: 8px; }
.sw-hint { font-size: 12px; color: var(--muted); margin: 6px 0 -2px; }
.sw-hint[hidden] { display: none; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0, 0, 0, .14); max-width: 280px; }
.tip .tt { font-weight: 700; margin-bottom: 2px; }
.tip .row { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); gap: 0 6px; align-items: center; }
.tip .row b { font-variant-numeric: tabular-nums; }
.tip .row i { display: block; height: 2px; background: var(--data); border-radius: 1px; }
.tip .row i.no { background: transparent; }
.tip .row span { color: var(--muted); }
.notice { font-size: 13px; color: var(--muted); }
.box-quiet { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.sec-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

/* 家 */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-size: 14px; }
.subtabs button[aria-selected="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); font-weight: 700; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.toggles label { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
.toggles input { width: 18px; height: 18px; accent-color: var(--data); }
.plan .bld { fill: var(--ctx-fill); stroke: var(--fg); stroke-width: 1; }
.plan .bld.sel { fill: var(--data); }
.plan .ftg { fill: none; stroke: var(--fg); stroke-width: 1.2; }
.plan .ftg.sel { stroke: var(--data); stroke-width: 2.5; }
/* 建物の報告の大きな平面は、こい青でぬりつぶさない (大きな面はうすい色) */
.plan .bld.big { fill: var(--data-wash); stroke: var(--data); stroke-width: 2; }
.plan .ftg.big { fill: none; stroke: var(--data); stroke-width: 2.5; }
.plan .post { fill: var(--fg); }
.plan .hearth { stroke: var(--fg); stroke-width: 1.6; }
.plan .grave { fill: var(--fg); stroke: var(--surface); stroke-width: 1; }
.plan .bin { fill: var(--surface); stroke: var(--fg); stroke-width: .8; }
.plan .hull { fill: none; stroke: var(--muted); stroke-width: 1; }
.plan text.lbl { fill: var(--fg); font-size: 11px; font-weight: 700; }
.sortbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.sortbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; min-height: 36px; }
.sortbar button[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); font-weight: 700; }
.rowbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 2px 10px; min-height: 32px; font-size: 13px; color: var(--link); }

/* 人 */
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }
.filters label { display: inline-flex; align-items: center; gap: 6px; }
.filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 40px; }
.gcards { display: grid; gap: 10px; }
.gcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-size: 14px; scroll-margin-top: 190px; }
.gcard.hl { box-shadow: 0 0 0 2px var(--data); }
.gcard h3 { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 15px; }
.gcard h3 small { font-weight: 400; }
.gcard .mod { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 13px; }
.kinbtn { border: 0; background: none; color: var(--link); text-decoration: underline; padding: 0 3px; min-height: 28px; min-width: 28px; }
.hbars { display: grid; gap: 6px; }
.hbar { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; }
.hbar .track { display: flex; align-items: center; gap: 6px; min-height: 18px; }
.hbar .fill { display: block; flex: none; height: 14px; background: var(--data); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .v { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 層 */
.strata { display: grid; gap: 4px; }
.stratum { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); text-align: left; padding: 0; width: 100%; }
.stratum .sw { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.stratum .body { padding: 8px 10px; font-size: 13px; }
.stratum .body b { font-size: 14px; }
.stratum.sel { box-shadow: 0 0 0 2px var(--sel); }
.stratum.off .sw { background: var(--bg) !important; color: var(--muted) !important; border-right: 1px solid var(--line); }
.ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 13px; }
.ladder div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; background: var(--surface); }
.ladder b { display: block; font-size: 14px; word-break: keep-all; }
@media (max-width: 420px) { .ladder b { font-size: 12.5px; } }
.meter { height: 12px; background: var(--data-wash); border-radius: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--data); }

dialog.sheet { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 0; width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 14px 14px 0 0; max-height: 86vh; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .35); }
.sheet-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet-head h2 { margin: 0; font-size: 17px; }
.sheet-body { padding: 12px 14px 20px; display: grid; gap: 12px; font-size: 14px; }
.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.timeline li { padding: 2px 0 6px 12px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--data); }
.timeline li b { font-weight: 700; margin-right: 6px; }

.empty { color: var(--muted); }
footer { font-size: 12px; color: var(--muted); padding-block: 16px 32px; }

@media (min-width: 700px) {
  .tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .gcards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
}
@media (min-width: 1000px) {
  h1 { font-size: 28px; }
  .tile .value { font-size: 26px; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .cols > div { display: grid; gap: 14px; min-width: 0; }
  .cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cols.plancols { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); }
  dialog.sheet { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: 440px; border-radius: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
@media (forced-colors: active) { .g-line { stroke: CanvasText; } .g-dot, .g-pres { fill: CanvasText; } }
</style>
</head>
<body>
