const YEARS = Object.keys(D.years).map(Number).sort((a, b) => a - b);
const LAST = D.asof.last_year;
const ERA = {s1: [0, 3], s2: [4, 200], s3: [201, LAST]};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const R = y => D.years[String(y)] || null;
const TAGS = D.defs.tags;
function nf(v, d) { return v == null || Number.isNaN(v) ? "—" : Number(v).toLocaleString("ja-JP", {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); }
function fmt(id, v) {
  const i = DEF[id] || {};
  if (v == null) return "—";
  if (i.kind === "pct") return nf(v * 100, 1) + "%";
  if (i.kind === "ratio3") return nf(v, 3);
  if (i.kind === "ratio") return nf(v, Math.abs(v) < 10 ? 2 : 1);
  return nf(v, Math.abs(v) < 10 && v % 1 ? 1 : 0);
}
function unitOf(id) { const u = (DEF[id] || {}).unit || ""; return u === "%" ? "" : u; }
function tag(t) { return t && t !== "―" ? `<span class="tag" title="数の出どころ: ${esc(TAGS[t] || "")}">${esc(t)}</span>` : ""; }
function delta(id, cur, prev) {
  const i = DEF[id] || {};
  if (cur == null) return '<div class="d">記録なし</div>';
  if (prev == null) return '<div class="d">去年の記録なし</div>';
  const pct = i.kind === "pct";
  const diff = pct ? (cur - prev) * 100 : cur - prev;
  const ps = fmt(id, prev) + (pct ? "" : unitOf(id));
  if (Math.abs(diff) < (pct ? 0.05 : (Math.abs(prev) < 10 ? 0.005 : 0.5))) return `<div class="d">― 去年と同じ (${esc(ps)})</div>`;
  let ds;
  if (pct) ds = (diff > 0 ? "+" : "") + nf(diff, 1) + " ポイント";
  else if (["gdp", "gdp_pc", "harvest", "work_days", "supply", "bal_village", "bal_house", "coal_burned", "coal_dug"].includes(id) && prev) ds = (diff > 0 ? "+" : "") + nf(diff / Math.abs(prev) * 100, 1) + "%";
  else ds = (diff > 0 ? "+" : "") + nf(diff, Math.abs(diff) < 10 && diff % 1 ? 2 : 0);
  const cls = i.good ? ((diff > 0) === (i.good === "up") ? " up" : " down") : "";
  return `<div class="d${cls}">${diff > 0 ? "▲" : "▼"} ${esc(ds)} <span class="muted">(去年 ${esc(ps)})</span></div>`;
}
function tile(id, y, extra) {
  const i = DEF[id], r = R(y) || {}, p = R(y - 1) || {};
  if (!i) return "";
  if (i.status === "―") return offTile(i);
  return `<div class="kpi" title="${esc(i.name)}"><div class="k">${esc(i.name)}${tag(i.tag)}</div>` +
    `<div class="v">${esc(fmt(id, r[id]))}<small>${esc(i.kind === "pct" ? "%" : i.unit)}</small></div>${delta(id, r[id], p[id])}` +
    (extra ? `<div class="x">${extra}</div>` : "") + "</div>";
}
function offTile(i, why) {
  return `<div class="kpi off" title="${esc(i.unlock || why || "")}"><div class="k">${esc(i.name)}</div><div class="v">${esc(why ? "この時代にはまだない" : "まだこの村にはない")}</div>` +
    `<div class="x">${esc(why || i.unlock || "")}</div></div>`;
}

/* ---------- 線の図 (1 つの目盛り。十字線となぞると出る数) ---------- */
const CH = [];
function niceStep(span) { for (let k = -3; k < 10; k++) for (const m of [1, 2, 2.5, 5]) { const s = m * 10 ** k; if (span / s <= 4) return s; } return span; }
function lineChart(o) {
  // o: {series:[{name,pts:[[x,y]],color}], x0,x1, xfmt, yfmt, lo0, breaks:[[x,label]], marks:[[x,label]], goal:[v,label], h}
  const W = o.w || 380, H = o.h || 200, L = 40, Rr = 50, T = o.marks && o.marks.length ? 18 : 10, B = 22;
  const all = o.series.flatMap(s => s.pts.filter(p => p[1] != null).map(p => p[1])).concat(o.goal ? [o.goal[0]] : []);
  if (!all.length) return '<div class="note">この時代の記録がない</div>';
  let hi = Math.max(...all), lo = o.lo0 === false ? Math.min(...all) : Math.min(0, ...all);
  if (hi === lo) hi = lo + (Math.abs(lo) || 1);
  const step = niceStep(hi - lo), vmin = Math.floor(lo / step) * step, vmax = Math.ceil(hi / step) * step;
  const x0 = o.x0, x1 = o.x1 === o.x0 ? o.x0 + 1 : o.x1;
  const X = x => L + (W - L - Rr) * (x - x0) / (x1 - x0), Yv = v => T + (H - T - B) * (1 - (v - vmin) / (vmax - vmin || 1));
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "")}">`];
  for (let v = vmin; v <= vmax + step / 2; v += step) s.push(`<line class="${Math.abs(v) < 1e-9 || v === vmin ? "ax" : "gl"}" x1="${L}" x2="${W - Rr}" y1="${Yv(v)}" y2="${Yv(v)}"/><text class="tm" x="${L - 4}" y="${Yv(v) + 3.5}" text-anchor="end">${esc(o.yfmt(v, true))}</text>`);
  const xt = o.xticks || [x0, x1];
  xt.forEach((x, k) => s.push(`<text class="tm" x="${X(x)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === xt.length - 1 ? "end" : "middle"}">${esc(o.xfmt(x))}</text>`));
  (o.breaks || []).forEach(([x, lab]) => { if (x > x0 && x < x1) s.push(`<line class="brk" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H - B}"><title>${esc(lab)}</title></line>`); });
  if (o.goal) s.push(`<line class="goal" x1="${L}" x2="${W - Rr}" y1="${Yv(o.goal[0])}" y2="${Yv(o.goal[0])}"/><text class="tm" x="${L + 3}" y="${Yv(o.goal[0]) - 3}">${esc(o.goal[1])}</text>`);
  (o.marks || []).forEach(([x, lab]) => { if (x >= x0 && x <= x1) s.push(`<text x="${X(x)}" y="11" text-anchor="middle" font-size="10" fill="var(--text-secondary)">◆<title>${esc(lab)}</title></text>`); });
  const ends = [];
  o.series.forEach(se => {
    let seg = [];
    const flush = () => { if (seg.length > 1) s.push(`<polyline class="ln" style="stroke:${se.color}" points="${seg.join(" ")}"/>`); else if (seg.length === 1) { const [a, b] = seg[0].split(","); s.push(`<circle cx="${a}" cy="${b}" r="3" fill="${se.color}"/>`); } seg = []; };
    se.pts.forEach(p => { if (p[1] == null) flush(); else seg.push(`${X(p[0]).toFixed(1)},${Yv(p[1]).toFixed(1)}`); });
    flush();
    const lastp = [...se.pts].reverse().find(p => p[1] != null);
    if (lastp) { s.push(`<circle cx="${X(lastp[0])}" cy="${Yv(lastp[1])}" r="4" fill="${se.color}" stroke="var(--card)" stroke-width="2"/>`);
      ends.push({x: X(lastp[0]) + 7, y: Yv(lastp[1]) + 4, t: o.yfmt(lastp[1], false) + (o.series.length > 1 ? " " + se.name : "")}); }
  });
  ends.sort((a, b) => a.y - b.y);
  ends.forEach((e, k) => { if (k && e.y - ends[k - 1].y < 12) e.y = ends[k - 1].y + 12; s.push(`<text class="tv" x="${e.x}" y="${e.y}">${esc(e.t)}</text>`); });
  s.push(`<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/><rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}" fill="transparent" class="hit"/></svg>`);
  const id = CH.length;
  CH.push({o, X, W, L, Rr, x0, x1});
  const leg = o.series.length > 1 ? `<div class="legend">${o.series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join("")}</div>` : "";
  return `${leg}<div class="chart" data-ch="${id}">${s.join("")}<div class="tip"></div></div>`;
}
function wireCharts(root) {
  root.querySelectorAll(".chart[data-ch]").forEach(el => {
    if (el.dataset.w) return; el.dataset.w = 1;
    const c = CH[+el.dataset.ch], svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), tip = el.querySelector(".tip"), hit = svg.querySelector(".hit");
    const xs = [...new Set(c.o.series.flatMap(s => s.pts.filter(p => p[1] != null).map(p => p[0])))].sort((a, b) => a - b);
    const show = ev => {
      const bb = svg.getBoundingClientRect(), sx = (ev.clientX - bb.left) / bb.width * c.W;
      const xv = c.x0 + (sx - c.L) / (c.W - c.L - c.Rr) * (c.x1 - c.x0);
      let best = xs[0]; for (const x of xs) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x;
      const px = c.X(best);
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
      tip.textContent = "";
      const h = document.createElement("div"); h.textContent = c.o.xfmt(best, true); h.className = "muted"; tip.appendChild(h);
      c.o.series.forEach(se => { const p = se.pts.find(q => q[0] === best); const d = document.createElement("div"); const b = document.createElement("b"); b.textContent = p && p[1] != null ? c.o.yfmt(p[1], false) : "—"; d.appendChild(b); if (c.o.series.length > 1) d.appendChild(document.createTextNode(" " + se.name)); tip.appendChild(d); });
      tip.style.display = "block";
      const left = px / c.W * bb.width; tip.style.left = Math.min(Math.max(0, left + 10), bb.width - tip.offsetWidth) + "px"; tip.style.top = "0px";
    };
    hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", () => { xh.style.display = "none"; tip.style.display = "none"; });
  });
  wireCompo(root);
}
const COL = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];
const yr = x => `${Math.round(x)}年`;
function yearChart(id, y0, y1, o) {
  o = o || {};
  const pts = []; for (let y = y0; y <= y1; y++) { const r = R(y); let v = r ? r[id] : null; if (v != null && DEF[id] && DEF[id].kind === "pct") v *= 100; pts.push([y, v]); }
  const pct = DEF[id] && DEF[id].kind === "pct";
  return lineChart(Object.assign({series: [{name: DEF[id] ? DEF[id].name : id, pts, color: COL[0]}], x0: y0, x1: y1, xfmt: yr,
    yfmt: (v, ax) => pct ? nf(v, ax ? 0 : 1) + "%" : nf(v, Math.abs(v) < 10 && !ax ? 2 : 0), lo0: true, breaks: BREAKS, label: DEF[id] ? DEF[id].name : id}, o));
}
const BREAKS = D.defs.breaks.map(b => [b.day / Y, b.what]);

/* ---------- 見出しと タブ ---------- */
const TABS = [["cover", "全体の年表"], ["s1", "Society 1.0"], ["s2", "Society 2.0"], ["s3", "Society 3.0"], ["tech", "テクノロジー"], ["defs", "数の決まり"]];

document.getElementById("band").innerHTML = `数えた日: ${esc(D.asof.label)} まで (終わった年は ${LAST}年) ・ 次に出す日: ${LAST + 1}年の終わり (年に 1 回、年報といっしょに)。` +
  ` 札: ${Object.entries(TAGS).map(([k, v]) => tag(k) + " " + esc(v)).join("・")}。しま模様の枠は「まだない」数 (0 ではない)。`;
const tabs = document.getElementById("tabs");
tabs.innerHTML = TABS.map(([k, n]) => `<button role="tab" data-t="${k}" aria-selected="false">${esc(n)}</button>`).join("");
const built = {};
function go(k) {

/* ---------- 全体の年表 (表紙) ---------- */
function cover(p) {
  const now = D.asof.day / Y;
  const segs = D.era_log.map((e, k) => ({era: e.era, from: e.day, to: k + 1 < D.era_log.length ? D.era_log[k + 1].day : D.asof.day}))
    .filter(s => s.to > s.from || s.era === "G15");
  const so = d => d < 489 ? "s1" : d < 24120 ? "s2" : "s3";
  const band = [["s1", 0, 489, "Society 1.0"], ["s2", 489, 24120, "Society 2.0"], ["s3", 24120, D.asof.day + 1, "Society 3.0"]];
  let h = `<div class="card"><h2 style="margin-top:0">0年 → ${LAST}年: 3 つの時代</h2>` +
    `<div class="eraband">${band.map(([k, a, b, n], i) => `<button style="flex:${Math.max(b - a, 2600)};border-top-color:${COL[i]}" data-go="${k}" title="${esc(n)} (${Math.floor(a / Y)}〜${Math.floor((b - 1) / Y)}年)">${esc(n.replace("Society ", ""))}</button>`).join("")}</div>` +
    `<div class="note">帯は左から Society 1.0・2.0・3.0。押すと、その時代のダッシュボードへ (Society 1.0 は 4 年だけなので、帯は広げてある)。フェーズ: ${segs.map(s => `${esc(s.era)} ${Math.floor(s.from / Y)}年`).join("・")}。` +

  const reached = D.tech.techs.filter(t => t.first_day != null && (t.status === "届いた")).map(t => [t.first_day / Y, `◆ ${t.name} (${Math.floor(t.first_day / Y)}年に届いた)`])
    .concat(D.tech.techs.filter(t => t.status === "あとで届いた").map(t => [t.later_year, `◆ ${t.name} (あとで届いた ${t.later_year}年)`]))

  h += `<div class="note">◆ はテクノロジーツリーで「届いた」日 (なぞると名前)。点線はコードや時代の区切り。</div></div>`;

  const long = (title, note, pts, o) => `<div class="fcard"><div class="hd"><h3>${esc(title)}</h3></div><div class="note">${esc(note)}</div>${lineChart(Object.assign({series: [{name: title, pts, color: COL[0]}], x0: 0, x1: LAST, xfmt: yr, xticks: [0, 50, 100, 150, 200, LAST], yfmt: (v, ax) => nf(v, 0), breaks: BREAKS, label: title}, o || {}))}</div>`;

  h += long("村の生産 (大人 1 年分)", "4 季節そろった年だけ。3569 日目 (G6) より前は食べ物だけ", YEARS.map(y => [y, R(y).gdp_full_year ? R(y).gdp : null]), {lo0: false});
  h += long("読める大人 (%)", "数えた年 (198年) から", ys("literacy", 100), {yfmt: (v, ax) => nf(v, ax ? 0 : 1) + "%"});

    `<li>年報 (${D.reports[0]}年〜): ${D.reports.slice(-6).map(y => `<a href="../reports/year${y}.html">${y}年</a>`).join("・")} ほか</li>` +

/* ---------- 時代のダッシュボード (Society 2.0・3.0) ---------- */
const HEAD = ["pop", "gdp", "store_min", "nonfood", "literacy", "imr"];
const FIELD_HEAD = {pop: ["pop", "households", "pop_growth"], vital: ["births", "deaths", "e0"], econ: ["gdp", "gdp_pc", "gdp_growth"],
  work: ["work_days", "work_food", "rest_share"], food: ["harvest", "kcal_pc", "store_min"], price: ["trade_ratio"], living: ["wealth_gini", "store_gini", "rain_out"],
  edu: ["literacy", "kids_taught"], health: ["imr", "u5mr", "sick_deaths", "care_kids"], ext: ["trade_in", "partners", "town_done"], rules: ["laws", "disputes"], env: ["coal_burned", "canal_days"]};
function inEra(i, era) { return i.eras.includes(+era.slice(1)); }
function eraPanel(era) {

  const [a, b] = ERA[era];

  p.innerHTML = `<div class="card"><h2 style="margin-top:0">${era === "s2" ? "Society 2.0 (G1〜G15・4〜200年)" : "Society 3.0 (フェーズ 1〜5・201年〜)"}</h2>` +
    `<label class="note">年を選ぶ: <select id="sel-${era}">${ys.slice().reverse().map(y => `<option value="${y}">${y}年</option>`).join("")}</select></label>` +
    `<div class="note">その年の数と、去年からの動き (割合は「ポイント」、量は % か数)。緑はよい向き・赤はわるい向き・良い悪いのない数は色なし。</div><div id="body-${era}"></div></div>`;
  const sel = p.querySelector("select");

  sel.addEventListener("change", draw); draw();
  p.addEventListener("click", e => { const b = e.target.closest(".gsum"); if (!b) return; const g = b.parentElement; const c = g.classList.toggle("closed");
    b.setAttribute("aria-expanded", !c); b.firstChild.textContent = (c ? "▸" : "▾") + b.firstChild.textContent.slice(1); });
}
function eraBody(era, y, ya, yb) {

    if (id === "imr" && r.imr5 != null) x = `5 年の平均 ${nf(r.imr5)}‰ (この年の出生 ${r.births} 人・1 歳前の死亡 ${r.infant_deaths} 人)`;
    if (id === "literacy" && r.lit_adults) x = `大人 ${r.lit_adults} 人のうち ${r.readers} 人`;
    if (id === "store_min") x = "いまの人数で何日食べられるか";
    if (id === "pop") x = `女 ${nf(r.female)}・男 ${nf(r.male)}`;
    h += tile(id, y, esc(x));
  });
  h += tile("famine", y, "村の蓄えが尽きた回数 (0 がよい)");
  h += "</div>";
  // 12 分野 (スマホでは 6 つにたたむ)
  const groups = [...new Set(FIELDS.map(f => f.fold))];

  const ref = d.reference_236, r236 = R(ref.year) || {};
  h += `<div class="card"><h3>設計に書いた ${ref.year}年の数 (参考の数) と、照らし合わせ</h3><p class="note">${esc(ref.note)}。</p><div class="tw"><table><tr><th>数</th><th>設計の数</th><th>計算 (${ref.year}年)</th></tr>${Object.entries(ref.values).map(([k, v]) => { const c = (D.check.ref_calc || {})[k]; return `<tr><td>${esc(k)}</td><td class="n">${esc(nf(v, v % 1 ? 3 : 0))}</td><td class="n">${esc(c == null ? "—" : nf(c, c % 1 ? 3 : 0))}</td></tr>`; }).join("")}</table></div>` +
    `<p class="note">照らし合わせ (tools/stats_calc.py --check): 年報 (reports/yearN.html) に書いた数と設計の数、あわせて ${D.check.n} をくらべ、ちがう所 ${D.check.bad.length}:</p>` +
    `<div class="tw"><table><tr><th>どこ</th><th>年</th><th>数</th><th>書いた数</th><th>計算</th><th>わけ</th></tr>${D.check.bad.map(b => `<tr><td>${esc(b.src)}</td><td class="n">${b.year}</td><td>${esc(b.key)}</td><td class="n">${esc(nf(b.report, b.report % 1 ? 3 : 0))}</td><td class="n">${esc(b.calc == null ? "—" : nf(b.calc, b.calc % 1 ? 3 : 0))}</td><td>${esc(b.why || (b.src.startsWith("設計") ? "設計の数は 237年の終わりの state を読んだと見られる (236年の終わりの数は計算のほう)" : ""))}</td></tr>`).join("")}</table></div></div>`;
  h += `<div class="card"><h3 id="refs">出典 (見た日はみな 2026-11-22)</h3><div class="tw"><table><tr><th>番号</th><th>出した所</th><th>題名</th><th>版・年</th><th>開いた URL</th><th>使った所</th><th>使い方</th></tr>` +
    d.refs.map(r => `<tr id="ref${r.n}"><td>[${r.n}]</td><td>${esc(r.publisher)}</td><td>${esc(r.title)}</td><td>${esc(r.edition)}</td><td><a href="${esc(r.url)}" rel="noopener">${esc(r.url)}</a></td><td>${esc(r.used)}</td><td>${esc(r.how)}</td></tr>`).join("") + "</table></div>" +
    `<h3>開けなかったページ</h3><p class="note">${esc(d.refs_unreached)}</p><h3>村の数の出どころ</h3><p class="note">${esc(d.village_sources)}</p>` +
    `<p class="note">このページの数は tools/build_stats.py が ${esc(D.asof.built)} に、data/ を読むだけで作った (${esc(D.asof.label)} まで)。設計: docs/society_phase/dashboard_official_design.md。</p></div>`;
  p.innerHTML = h;
}
document.addEventListener("click", e => { const a = e.target.closest("a[data-ref]"); if (a) { e.preventDefault(); go("defs"); setTimeout(() => { const t = document.getElementById("ref" + a.dataset.ref); if (t) t.scrollIntoView(); }, 0); } });
go(location.hash.slice(1) || "cover");
</script>
