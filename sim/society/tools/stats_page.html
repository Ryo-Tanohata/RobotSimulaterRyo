<style>

 --text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#a3a198;--grid:#2c2c2a;--axis:#45443f;--track:#2c2c2a;--ring:rgba(255,255,255,.12);
 --series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--good:#0ca30c;--bad:#e66767;--focus:#86b6ef;--hatch:#242422;
 --series-4:#c98500;--series-5:#d55181;--series-6:#0ca30c;--series-7:#9085e9;--series-8:#e66767;--oa1:#184f95;--oa2:#3987e5;--oa3:#9ec5f4;--ob1:#184f95;--ob2:#256abf;--ob3:#3987e5;--ob4:#6da7ec;--ob5:#9ec5f4;}}
:root[data-theme="dark"] .viz-root{color-scheme:dark;--surface-0:#0d0d0d;--surface-1:#1a1a19;--card:#151514;--text-primary:#f0efec;--text-secondary:#c3c2b7;
 --text-muted:#a3a198;--grid:#2c2c2a;--axis:#45443f;--track:#2c2c2a;--ring:rgba(255,255,255,.12);--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;
 --good:#0ca30c;--bad:#e66767;--focus:#86b6ef;--hatch:#242422;
 --series-4:#c98500;--series-5:#d55181;--series-6:#0ca30c;--series-7:#9085e9;--series-8:#e66767;--oa1:#184f95;--oa2:#3987e5;--oa3:#9ec5f4;--ob1:#184f95;--ob2:#256abf;--ob3:#3987e5;--ob4:#6da7ec;--ob5:#9ec5f4;}
*{box-sizing:border-box}
html,body{margin:0}
body.viz-root{background:var(--surface-0);color:var(--text-primary);font:15px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:1080px;margin:0 auto;padding:10px 12px 60px}
h1{font-size:21px;line-height:1.35;margin:4px 0 2px} h2{font-size:18px;margin:18px 0 8px} h3{font-size:15.5px;margin:0}
a{color:var(--series-1)} .muted{color:var(--text-muted)} .sec{color:var(--text-secondary)}
.band{font-size:13px;color:var(--text-secondary);line-height:1.5}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;position:sticky;top:0;background:var(--surface-0);padding:6px 0;z-index:5}

.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:10px 12px;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;padding:8px 10px;line-height:1.3}
.kpi .k{font-size:12.5px;color:var(--text-secondary)} .kpi .v{font-size:25px;font-weight:650;margin:2px 0}
.kpi .v small{font-size:12.5px;font-weight:500;color:var(--text-secondary);margin-left:3px}

.grp{display:contents}.grp>.gsum{display:none}.grp>.fcard{order:var(--o)}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

th,td{border-bottom:1px solid var(--grid);padding:3px 5px;text-align:left;vertical-align:top}

 box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;z-index:3;display:none}

.bars .row{display:grid;grid-template-columns:8.5em 1fr 4.5em;gap:6px;align-items:center;font-size:12.5px;margin:2px 0}

select{font:inherit;font-size:14px;padding:2px 6px;border-radius:6px;border:1px solid var(--ring);background:var(--surface-1);color:var(--text-primary)}

.cwrap .chart{width:100%;max-width:300px;margin:0 auto}
.cleg{font-size:12.5px;border-collapse:collapse;width:100%}
.cleg td{border-bottom:1px solid var(--grid);padding:2px 4px}
.cleg .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dn path{cursor:default}.dn path:focus{outline:none}.dn path:focus-visible,.dn path.hv{stroke:var(--text-primary);stroke-width:2}
.dlab{font-size:11px;fill:var(--text-primary);font-weight:600}.dlab2{font-size:10px;fill:var(--text-secondary)}
.dc1{font-size:17px;font-weight:650;fill:var(--text-primary)}.dc2{font-size:10.5px;fill:var(--text-secondary)}
.sb .sel{fill:var(--text-primary)}
.dn path.dr{cursor:pointer}
.lnk{font:inherit;color:var(--series-1);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.crumb{font-size:12.5px;color:var(--text-secondary);margin:0 0 4px}.crumb b{color:var(--text-primary)}
tr.fd td{background:var(--surface-1)}
@media (max-width:640px){
 .grid{display:block}
 .grp{display:block;background:var(--card);border:1px solid var(--ring);border-radius:12px;margin:8px 0;padding:0 8px}
 .grp>.gsum{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--text-primary);cursor:pointer;font-weight:700;padding:8px 2px;font-size:15px}
 .grp.closed>.fcard{display:none}
 .grp .fcard{border:0;border-top:1px solid var(--grid);border-radius:0;padding:8px 2px}
 .kpi .v{font-size:21px}
}
/* 解説の係 (2026-11-24。D.explain があるときだけ使う) */
.xnote{font-size:12px;color:var(--text-secondary);line-height:1.45;margin:0 0 6px;padding:3px 7px;border-left:3px solid var(--grid)}
.xb{display:flex;gap:7px;align-items:flex-start;margin:6px 0 4px}
.xb img{width:40px;height:40px;border-radius:50%;flex:none;border:1px solid var(--ring);background:#f3efe6;object-fit:cover}

.xb .bl:before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;background:#fff7e0;border-left:1px solid #e9d39a;border-bottom:1px solid #e9d39a;transform:rotate(45deg)}
.xb .who{display:block;font-size:11px;color:#6f6d68}
.x3{border:2px solid #e9d39a;border-radius:12px;padding:8px 10px 4px;margin:8px 0}
.x3 ol{margin:4px 0 2px;padding-left:22px}.x3 li{margin:3px 0 6px;font-size:13.5px;line-height:1.5}.x3 li b{display:block}
@media (forced-colors:active){.ln{stroke:CanvasText}.off{background:none;border:1px dashed CanvasText}}

<body class="viz-root" data-palette="#2a78d6,#eb6834,#1baf7a,#eda100,#e87ba4,#008300,#6250d6,#e34948">
<main>
<h1 id="ttl">川辺の村の統計</h1>
<div class="band" id="band"></div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<section class="panel" id="p-cover"></section>
<section class="panel" id="p-s1"></section>
<section class="panel" id="p-s2"></section>
<section class="panel" id="p-s3"></section>
<section class="panel" id="p-tech"></section>
<section class="panel" id="p-defs"></section>
</main>
<script>
"use strict";
const D = /*DATA*/;
const Y = 120, UNIT = D.defs.unit_adult_year_kcal;
const DEF = Object.fromEntries(D.defs.indicators.map(i => [i.id, i]));
const FIELDS = D.defs.fields;
const YEARS = Object.keys(D.years).map(Number).sort((a, b) => a - b);
const LAST = D.asof.last_year;
const ERA = {s1: [0, 3], s2: [4, 200], s3: [201, LAST]};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const R = y => D.years[String(y)] || null;
const TAGS = D.defs.tags;
function nf(v, d) { return v == null || Number.isNaN(v) ? "—" : Number(v).toLocaleString("ja-JP", {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); }
function fmt(id, v) {
  const i = DEF[id] || {};
  if (v == null) return "—";
  if (i.kind === "pct") return nf(v * 100, 1) + "%";
  if (i.kind === "ratio3") return nf(v, 3);
  if (i.kind === "ratio") return nf(v, Math.abs(v) < 10 ? 2 : 1);
  return nf(v, Math.abs(v) < 10 && v % 1 ? 1 : 0);
}
function unitOf(id) { const u = (DEF[id] || {}).unit || ""; return u === "%" ? "" : u; }
function tag(t) { return t && t !== "―" ? `<span class="tag" title="数の出どころ: ${esc(TAGS[t] || "")}">${esc(t)}</span>` : ""; }
function delta(id, cur, prev) {
  const i = DEF[id] || {};
  if (cur == null) return '<div class="d">記録なし</div>';
  if (prev == null) return '<div class="d">去年の記録なし</div>';
  const pct = i.kind === "pct";
  const diff = pct ? (cur - prev) * 100 : cur - prev;
  const ps = fmt(id, prev) + (pct ? "" : unitOf(id));
  if (Math.abs(diff) < (pct ? 0.05 : (Math.abs(prev) < 10 ? 0.005 : 0.5))) return `<div class="d">― 去年と同じ (${esc(ps)})</div>`;
  let ds;
  if (pct) ds = (diff > 0 ? "+" : "") + nf(diff, 1) + " ポイント";
  else if (["gdp", "gdp_pc", "harvest", "work_days", "supply", "bal_village", "bal_house", "coal_burned", "coal_dug"].includes(id) && prev) ds = (diff > 0 ? "+" : "") + nf(diff / Math.abs(prev) * 100, 1) + "%";
  else ds = (diff > 0 ? "+" : "") + nf(diff, Math.abs(diff) < 10 && diff % 1 ? 2 : 0);
  const cls = i.good ? ((diff > 0) === (i.good === "up") ? " up" : " down") : "";
  return `<div class="d${cls}">${diff > 0 ? "▲" : "▼"} ${esc(ds)} <span class="muted">(去年 ${esc(ps)})</span></div>`;
}
function tile(id, y, extra) {
  const i = DEF[id], r = R(y) || {}, p = R(y - 1) || {};
  if (!i) return "";
  if (i.status === "―") return offTile(i);
  return `<div class="kpi" title="${esc(i.name)}"><div class="k">${esc(i.name)}${tag(i.tag)}</div>` +
    `<div class="v">${esc(fmt(id, r[id]))}<small>${esc(i.kind === "pct" ? "%" : i.unit)}</small></div>${delta(id, r[id], p[id])}` +
    (extra ? `<div class="x">${extra}</div>` : "") + "</div>";
}
function offTile(i, why) {
  return `<div class="kpi off" title="${esc(i.unlock || why || "")}"><div class="k">${esc(i.name)}</div><div class="v">${esc(why ? "この時代にはまだない" : "まだこの村にはない")}</div>` +
    `<div class="x">${esc(why || i.unlock || "")}</div></div>`;
}

/* ---------- 線の図 (1 つの目盛り。十字線となぞると出る数) ---------- */
const CH = [];
function niceStep(span) { for (let k = -3; k < 10; k++) for (const m of [1, 2, 2.5, 5]) { const s = m * 10 ** k; if (span / s <= 4) return s; } return span; }
function lineChart(o) {
  // o: {series:[{name,pts:[[x,y]],color}], x0,x1, xfmt, yfmt, lo0, breaks:[[x,label]], marks:[[x,label]], goal:[v,label], h}
  const W = o.w || 380, H = o.h || 200, L = 40, Rr = 50, T = o.marks && o.marks.length ? 18 : 10, B = 22;
  const all = o.series.flatMap(s => s.pts.filter(p => p[1] != null).map(p => p[1])).concat(o.goal ? [o.goal[0]] : []);
  if (!all.length) return '<div class="note">この時代の記録がない</div>';
  let hi = Math.max(...all), lo = o.lo0 === false ? Math.min(...all) : Math.min(0, ...all);
  if (hi === lo) hi = lo + (Math.abs(lo) || 1);
  const step = niceStep(hi - lo), vmin = Math.floor(lo / step) * step, vmax = Math.ceil(hi / step) * step;
  const x0 = o.x0, x1 = o.x1 === o.x0 ? o.x0 + 1 : o.x1;
  const X = x => L + (W - L - Rr) * (x - x0) / (x1 - x0), Yv = v => T + (H - T - B) * (1 - (v - vmin) / (vmax - vmin || 1));
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "")}">`];
  for (let v = vmin; v <= vmax + step / 2; v += step) s.push(`<line class="${Math.abs(v) < 1e-9 || v === vmin ? "ax" : "gl"}" x1="${L}" x2="${W - Rr}" y1="${Yv(v)}" y2="${Yv(v)}"/><text class="tm" x="${L - 4}" y="${Yv(v) + 3.5}" text-anchor="end">${esc(o.yfmt(v, true))}</text>`);
  const xt = o.xticks || [x0, x1];
  xt.forEach((x, k) => s.push(`<text class="tm" x="${X(x)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === xt.length - 1 ? "end" : "middle"}">${esc(o.xfmt(x))}</text>`));
  (o.breaks || []).forEach(([x, lab]) => { if (x > x0 && x < x1) s.push(`<line class="brk" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H - B}"><title>${esc(lab)}</title></line>`); });
  if (o.goal) s.push(`<line class="goal" x1="${L}" x2="${W - Rr}" y1="${Yv(o.goal[0])}" y2="${Yv(o.goal[0])}"/><text class="tm" x="${L + 3}" y="${Yv(o.goal[0]) - 3}">${esc(o.goal[1])}</text>`);
  (o.marks || []).forEach(([x, lab]) => { if (x >= x0 && x <= x1) s.push(`<text x="${X(x)}" y="11" text-anchor="middle" font-size="10" fill="var(--text-secondary)">◆<title>${esc(lab)}</title></text>`); });
  const ends = [];
  o.series.forEach(se => {
    let seg = [];
    const flush = () => { if (seg.length > 1) s.push(`<polyline class="ln" style="stroke:${se.color}" points="${seg.join(" ")}"/>`); else if (seg.length === 1) { const [a, b] = seg[0].split(","); s.push(`<circle cx="${a}" cy="${b}" r="3" fill="${se.color}"/>`); } seg = []; };
    se.pts.forEach(p => { if (p[1] == null) flush(); else seg.push(`${X(p[0]).toFixed(1)},${Yv(p[1]).toFixed(1)}`); });
    flush();
    const lastp = [...se.pts].reverse().find(p => p[1] != null);
    if (lastp) { s.push(`<circle cx="${X(lastp[0])}" cy="${Yv(lastp[1])}" r="4" fill="${se.color}" stroke="var(--card)" stroke-width="2"/>`);
      ends.push({x: X(lastp[0]) + 7, y: Yv(lastp[1]) + 4, t: o.yfmt(lastp[1], false) + (o.series.length > 1 ? " " + se.name : "")}); }
  });
  ends.sort((a, b) => a.y - b.y);
  ends.forEach((e, k) => { if (k && e.y - ends[k - 1].y < 12) e.y = ends[k - 1].y + 12; s.push(`<text class="tv" x="${e.x}" y="${e.y}">${esc(e.t)}</text>`); });
  s.push(`<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/><rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}" fill="transparent" class="hit"/></svg>`);
  const id = CH.length;
  CH.push({o, X, W, L, Rr, x0, x1});
  const leg = o.series.length > 1 ? `<div class="legend">${o.series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join("")}</div>` : "";
  return `${leg}<div class="chart" data-ch="${id}">${s.join("")}<div class="tip"></div></div>`;
}
function wireCharts(root) {
  root.querySelectorAll(".chart[data-ch]").forEach(el => {
    if (el.dataset.w) return; el.dataset.w = 1;
    const c = CH[+el.dataset.ch], svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), tip = el.querySelector(".tip"), hit = svg.querySelector(".hit");
    const xs = [...new Set(c.o.series.flatMap(s => s.pts.filter(p => p[1] != null).map(p => p[0])))].sort((a, b) => a - b);
    const show = ev => {

      const px = c.X(best);

      const h = document.createElement("div"); h.textContent = c.o.xfmt(best, true); h.className = "muted"; tip.appendChild(h);

      svg.querySelectorAll("rect.hit").forEach(rc => {
        const b = c.bins[+rc.dataset.k];
        const f = ev => put([(b.b0 === b.b1 ? `${b.b0}年` : `${b.b0}〜${b.b1}年`)].concat(b.tot ? c.sp.parts.map((n, i) => `${n} ${nf(b.sum[i] / b.tot * 100, 1)}%`).reverse() : ["記録がない (またはマイナスの中身がある)"]), ev);
        rc.addEventListener("pointermove", f); rc.addEventListener("pointerdown", f); rc.addEventListener("pointerleave", hide);
      });
    }
  });
}
function defList(list) {
  return '<div class="tw"><table><tr><th>数</th><th>式</th><th>単位</th><th>出どころ</th><th>国の数</th><th>出典</th><th>時代</th><th>いつから</th></tr>' +
    list.map(i => `<tr><td>${esc(i.name)} ${tag(i.tag)}<span class="st">${esc(i.status)}</span></td><td>${esc(i.formula || i.unlock)}${i.note ? `<br><span class="muted">${esc(i.note)}</span>` : ""}</td><td>${esc(i.unit)}</td><td>${esc(i.source)}</td><td>${esc(i.national)}</td><td>${i.refs.map(n => `<a href="#ref${n}" data-ref="${n}">[${n}]</a>`).join("")}</td><td>${i.eras.map(e => e + ".0").join("・") || "—"}</td><td>${esc(i.since)}</td></tr>`).join("") + "</table></div>";
}

/* ---------- Society 1.0 (季節) ---------- */
function era1(p) {
  const S = D.s1, last = S[S.length - 1], prev = S[S.length - 2];
  const x = r => (r.from + r.to) / 2 / Y;
  const ch = (title, key, f, note) => `<div class="fcard"><div class="hd"><h3>${esc(title)}</h3>${tag("シ")}</div><div class="note">${esc(note || "")}</div>${lineChart({series: [{name: title, pts: S.map(r => [x(r), r[key] == null ? null : r[key] * (f || 1)]), color: COL[0]}], x0: 0, x1: 4.07, xfmt: v => (Number.isInteger(v) ? v : nf(v, 1)) + "年", xticks: [0, 1, 2, 3, 4], yfmt: (v, ax) => nf(v, ax ? 0 : 1), label: title, h: 160})}</div>`;
  let h = `<div class="card"><h2 style="margin-top:0">Society 1.0 (F1〜F5・0〜488 日目)</h2><div class="note">はじめの 5 人から、多くの日は 3 人の時代。4 年しかないので、1 行は季節 (30 日)。人が少なすぎるので、率 (出生率・乳児死亡率など) は出さず、数だけ出す。家・畑・帳はまだない。読むもの: archive/stats_*.jsonl (日ごとの数)・archive/days_*.json (人 × 日の仕事)・people.json・laws.json。</div>`;
  const k = (n, v, u, note) => `<div class="kpi"><div class="k">${esc(n)}${tag("シ")}</div><div class="v">${esc(v)}<small>${esc(u)}</small></div><div class="x">${esc(note || "")}</div></div>`;
  h += `<h3 style="margin:8px 0 4px">さいごの季節 (${esc(last.label)})</h3><div class="kpis">` +
    k("人", nf(last.pop), "人", `前の季節 ${nf(prev.pop)} 人・いちばん多い日 ${nf(Math.max(...S.map(r => r.pop_max)))} 人`) +
    k("1 人 1 日食べた", nf(last.kcal_pc), "kcal", "") + k("蓄え", nf(last.store_days, 1), "日分", "季節の終わりの蓄え ÷ (人 × 2,400 kcal)") +
    k("火の日", nf(S.reduce((a, r) => a + r.fire_days, 0)), "日", "488 日のうち火があった日") +
    k("生まれた・亡くなった", `${S.reduce((a, r) => a + r.births, 0)}・${S.reduce((a, r) => a + r.deaths, 0)}`, "人", "488 日の合計") +
    k("生きている掟", nf(last.laws), "件", "") + `</div></div>`;
  h += '<div class="grid">' + ch("人 (季節の終わり)", "pop") + ch("1 人 1 日食べた (kcal)", "kcal_pc") + ch("蓄え (日分)", "store_days") + ch("食べ物の仕事 (%)", "work_food", 100, "人 × 日の仕事のうち (休むをのぞく)") + "</div>";
  h += `<div class="card"><h3>季節ごとの表</h3><div class="tw"><table><tr><th>季節</th><th>人</th><th>生まれた</th><th>亡くなった</th><th>1 人 1 日 kcal</th><th>蓄え 日分</th><th>火の日</th><th>雨の日</th><th>住まいにいた日</th><th>仕事の人日</th><th>おもな仕事</th><th>掟</th></tr>` +
    S.map(r => `<tr><td>${esc(r.label)}</td><td class="n">${r.pop}</td><td class="n">${r.births}</td><td class="n">${r.deaths}</td><td class="n">${nf(r.kcal_pc)}</td><td class="n">${nf(r.store_days, 1)}</td><td class="n">${r.fire_days}</td><td class="n">${r.rain_days}</td><td class="n">${r.housed_days}</td><td class="n">${r.work_days}</td><td>${esc(Object.entries(r.jobs).slice(0, 3).map(([a, b]) => a + " " + b).join("・"))}</td><td class="n">${r.laws}</td></tr>`).join("") + "</table></div></div>";
  h += '<div class="card"><h3>この時代にはまだない分野</h3>';
  [["経済 (村の生産)", "○ 支出面だけ (食べた + 蓄えの増え)。村の会計 accounts は 489 日目から"], ["物の値うち", "交換がない"], ["暮らしと差", "家の倉がない"], ["教育", "字がない"], ["外とのつながり", "よその村との交換は G6 から"], ["出生と死亡の率", "人が少なすぎて率は出さない (数だけ)"]]
    .forEach(([a, b]) => { h += `<div class="greybox off">░ ${esc(a)}: この時代にはまだない<br>→ ${esc(b)}</div>`; });
  p.innerHTML = h + "</div>";
}

/* ---------- テクノロジー ---------- */
function tech(p) {
  const T = D.tech;
  const so = e => e === "A" ? "Society 1.0" : "Society 2.0";
  const chip = t => { const c = {"届いた": "ok", "あとで届いた": "late", "届かなかった": "ng", "まだ": "not"}[t.status] || "";
    const w = t.status === "届いた" && t.first_day != null ? ` ${Math.floor(t.first_day / Y)}年` : t.status === "あとで届いた" ? ` ${t.later_year}年` : t.year ? ` ${t.year}年` : "";
    return `<span class="chip ${c}" title="${esc((t.does || t.why || "") + (t.later_why ? " / あとで届いた: " + t.later_why : ""))}">${esc(t.name)}・${esc(t.status)}${esc(w)}${t.emerged ? " ◆創発" : ""}</span>`; };
  let h = `<div class="card"><h2 style="margin-top:0">テクノロジーの節</h2><div class="note">テクノロジーツリー (<a href="tech_tree.html">tech_tree.html</a>。${esc(T.asof.date)} まで) の 2 本の木 (テクノロジー・社会制度) を、時代ごとに分けた。` +
    `木の「届いた」は G の窓の中だけで見るので、そのあと記録の数に出たものを <b>「あとで届いた」</b> (4 つ目の状態) とした。Society 3.0 は予定の木に列がないので、記録の数から <b>Society 3.0 の列</b> を足した。</div>`;
  h += `<div class="legend"><span class="chip ok">届いた</span><span class="chip late">あとで届いた</span><span class="chip ng">届かなかった</span><span class="chip not">まだ</span></div></div><div class="grid">`;
  ["Society 1.0", "Society 2.0"].forEach(n => {
    const L = T.techs.filter(t => so(t.era) === n);
    const cnt = s => L.filter(t => t.status === s).length;
    h += `<div class="fcard"><div class="hd"><h3>${n} (列 ${n === "Society 1.0" ? "A" : "B〜I"})</h3></div><div class="note">予定 ${L.length}・届いた ${cnt("届いた")}・あとで届いた ${cnt("あとで届いた")}・届かなかった ${cnt("届かなかった")}・まだ ${cnt("まだ")}</div>` +
      ["テクノロジー", "社会制度"].map(tr => `<div class="note" style="margin-top:4px"><b>${tr}</b></div><div class="chips">${L.filter(t => t.tree === tr).map(chip).join("")}</div>`).join("") + "</div>";
  });
  h += `<div class="fcard"><div class="hd"><h3>Society 3.0 (新しい列)</h3></div><div class="note">予定の木 (plan.json) には列がないので、記録の数で「届いた年」を決めた。</div>` +
    ["テクノロジー", "社会制度"].map(tr => `<div class="note" style="margin-top:4px"><b>${tr}</b></div><div class="chips">${T.s3.filter(t => t.tree === tr).map(chip).join("")}</div>`).join("") +
    `<div class="tw"><table><tr><th>項目</th><th>届いた年</th><th>決め方</th><th>色がつく数</th></tr>${T.s3.map(t => `<tr><td>${esc(t.name)}</td><td class="n">${t.year ? t.year + "年" : "まだ"}</td><td>${esc(t.why)}</td><td>${esc(DEF[t.indicator] ? DEF[t.indicator].name : t.indicator)}</td></tr>`).join("")}</table></div></div>`;
  h += "</div>";
  // 初めて出たもの (イノベーション)
  const fy = YEARS.map(y => [y, T.firsts_by_year[String(y)] || 0]);
  h += `<div class="card"><h3>その年に初めて出たもの (プロダクトとやり方)</h3><div class="note">テクノロジーツリーの「初めての記録」(${T.counts.firsts} 件) の年ごとの数。国の「イノベーションを実現した企業の割合」[19] の近い形 (使った家の割合はまだ数えていない)。</div>` +
    lineChart({series: [{name: "初めて出たもの", pts: fy, color: COL[0]}], x0: YEARS[0], x1: LAST, xfmt: yr, xticks: [4, 50, 100, 150, 200, LAST], yfmt: v => nf(v), lo0: true, label: "初めて出たもの", w: 760, h: 170}) + "</div>";
  // つなぎの表
  const link = {};
  D.defs.indicators.forEach(i => i.tech.forEach(t => (link[t] = link[t] || []).push(i)));
  const st = n => (T.techs.find(t => t.name === n) || T.s3.find(t => t.name === n) || {}).status || "—";
  h += `<div class="card"><h3>テクノロジー → 色がつく数</h3><div class="tw"><table><tr><th>項目 (木)</th><th>いま</th><th>色がつく数</th></tr>` +
    Object.entries(link).map(([t, L]) => { const s = st(t); const grey = s === "まだ" || s === "届かなかった";
      return `<tr${grey ? ' class="off"' : ""}><td>${esc(t)}</td><td>${esc(s)}</td><td>${L.map(i => esc(i.name) + (i.status === "―" ? " (灰色)" : "")).join("・")}${grey ? "<br>→ 届くと色がつく" : ""}</td></tr>`; }).join("") + "</table></div></div>";
  h += `<div class="card"><h3>創発 (村の人が自分で見つけた知恵) ${T.emerged.length}</h3><div class="chips">${T.emerged.map(e => `<span class="chip">◆ ${esc(e.name)} ${Math.floor(e.day / Y)}年 (${esc(e.kind)})</span>`).join("")}</div>` +
    `<div class="note">研究開発にあたる「ためした人日」(仕事「試す」): ${YEARS.filter(y => R(y).try_days).map(y => `${y}年 ${R(y).try_days}`).slice(-8).join("・") || "なし"}。国の研究費の決まり [20] の近い形。</div></div>`;
  p.innerHTML = h;
}

/* ---------- 数の決まり ---------- */
function defs(p) {
  const d = D.defs;
  let h = `<div class="card"><h2 style="margin-top:0">数の決まり (定義・出どころ・出典)</h2><p class="note">1 つの数に 1 行。◎ は今の記録から国と同じ式で出せる・○ は近い形で出せる・― はまだこの村にない (灰色の枠。数を作らない)。` +
    `単位: ${esc(d.unit_note)}。村の 1 年は ${d.year_days} 日、年齢も村の年で数える。</p>` +
    `<h3 style="margin:10px 0 4px">構成比 (内わけ) の見せ方</h3><p class="note">国の統計は、全体を 100% とした内わけを円グラフで見せ、12 時から時計回りに大きい順、「その他」はいちばん最後、小さいものは「その他」にまとめる <a href="#ref21" data-ref="21">[21]</a>。` +
    `年ごとの変化は帯グラフを並べて見せ、帯の中の順は入れかえない <a href="#ref22" data-ref="22">[22]</a>。` +
    `村の円は 6 切れまでで、235 年を通して大きい順 (「その他」は最後) に並べ、横の 100% の帯と同じ順・同じ色にした。年齢と家の人数は順のある種類なので順のまま、1 つの青の濃さで描く。</p>`;
  FIELDS.forEach(f => { h += `<h3 style="margin:12px 0 4px">${esc(f.name)} <span class="note">(スマホでは「${esc(f.fold)}」にたたむ)</span></h3>` + defList(d.indicators.filter(i => i.field === f.key)) +
    d.indicators.filter(i => i.field === f.key && i.status === "―").map(i => `<div class="greybox off">░ ${esc(i.name)} → ${esc(i.unlock)}</div>`).join(""); });
  h += "</div>";
  h += `<div class="card"><h3>段ごとの育ち (灰色の枠が点く順)</h3><div class="tw"><table><tr><th>段</th><th>村で起きること</th><th>点く数</th></tr>${d.stages.map(s => `<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td>${esc(s[2])}</td></tr>`).join("")}</table></div>` +
    `<p class="note">灰色の枠は、条件がそろった年に色がつく (その年から数え、前の年は「記録なし」)。新しい記録は、次のフェーズを作るときに印をつけて足す (今は足していない)。それまで、文から読む数には「読みとり」と書く。</p>` +
    `<h3>区切り (線の点線)</h3><ul class="note">${d.breaks.map(b => `<li>${b.day} 日目 (${Math.floor(b.day / Y)}年): ${esc(b.what)}</li>`).join("")}</ul></div>`;
  const ref = d.reference_236, r236 = R(ref.year) || {};
  h += `<div class="card"><h3>設計に書いた ${ref.year}年の数 (参考の数) と、照らし合わせ</h3><p class="note">${esc(ref.note)}。</p><div class="tw"><table><tr><th>数</th><th>設計の数</th><th>計算 (${ref.year}年)</th></tr>${Object.entries(ref.values).map(([k, v]) => { const c = (D.check.ref_calc || {})[k]; return `<tr><td>${esc(k)}</td><td class="n">${esc(nf(v, v % 1 ? 3 : 0))}</td><td class="n">${esc(c == null ? "—" : nf(c, c % 1 ? 3 : 0))}</td></tr>`; }).join("")}</table></div>` +
    `<p class="note">照らし合わせ (tools/stats_calc.py --check): 年報 (reports/yearN.html) に書いた数と設計の数、あわせて ${D.check.n} をくらべ、ちがう所 ${D.check.bad.length}:</p>` +
    `<div class="tw"><table><tr><th>どこ</th><th>年</th><th>数</th><th>書いた数</th><th>計算</th><th>わけ</th></tr>${D.check.bad.map(b => `<tr><td>${esc(b.src)}</td><td class="n">${b.year}</td><td>${esc(b.key)}</td><td class="n">${esc(nf(b.report, b.report % 1 ? 3 : 0))}</td><td class="n">${esc(b.calc == null ? "—" : nf(b.calc, b.calc % 1 ? 3 : 0))}</td><td>${esc(b.why || (b.src.startsWith("設計") ? "設計の数は 237年の終わりの state を読んだと見られる (236年の終わりの数は計算のほう)" : ""))}</td></tr>`).join("")}</table></div></div>`;
  h += `<div class="card"><h3 id="refs">出典 (見た日はみな 2026-11-22)</h3><div class="tw"><table><tr><th>番号</th><th>出した所</th><th>題名</th><th>版・年</th><th>開いた URL</th><th>使った所</th><th>使い方</th></tr>` +
    d.refs.map(r => `<tr id="ref${r.n}"><td>[${r.n}]</td><td>${esc(r.publisher)}</td><td>${esc(r.title)}</td><td>${esc(r.edition)}</td><td><a href="${esc(r.url)}" rel="noopener">${esc(r.url)}</a></td><td>${esc(r.used)}</td><td>${esc(r.how)}</td></tr>`).join("") + "</table></div>" +
    `<h3>開けなかったページ</h3><p class="note">${esc(d.refs_unreached)}</p><h3>村の数の出どころ</h3><p class="note">${esc(d.village_sources)}</p>` +
    `<p class="note">このページの数は tools/build_stats.py が ${esc(D.asof.built)} に、data/ を読むだけで作った (${esc(D.asof.label)} まで)。設計: docs/society_phase/dashboard_official_design.md。</p></div>`;
  p.innerHTML = h;
}
